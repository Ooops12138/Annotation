[project]
name = "annotation"
version = "0.1.0"
description = "Annotation learning document POC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "openai>=1.37,<2.0",
  "langgraph>=0.6,<0.7",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
annotation = ["prompts/*.md"]
