[project]
name = "annotation"
version = "0.1.0"
description = "Annotation learning document POC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "openai>=1.37,<2.0",
  "langgraph>=0.6,<0.7",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
pdf-hybrid = [
  "rapidocr-onnxruntime>=1.4,<2.0",
  "pix2tex>=0.1.4,<0.2",
]
rag = [
  "llama-index-core>=0.12,<1.0",
  "llama-index-vector-stores-chroma>=0.4,<1.0",
  "llama-index-embeddings-openai>=0.3,<1.0",
  "llama-index-embeddings-huggingface>=0.4,<1.0",
  "chromadb>=0.5,<1.0",
]
rag-local-embeddings = [
  "sentence-transformers>=3.0,<6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
annotation = ["prompts/*.md"]
